<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kudakwashe SIBANDA – Contact</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Contact Me</h1>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Send me a message</h2>

    <form>
      <p>
        <label for="name">Your name</label>
        <input type="text" id="name" name="name" required>
      </p>

      <p>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required>
      </p>

      <p>
        <label for="topic">What is your message about?</label>
        <select id="topic" name="topic">
          <option value="fashion">Fashion</option>
          <option value="social-media">Social media</option>
          <option value="other">Other</option>
        </select>
      </p>

      <fieldset>
        <legend>How would you like me to reply?</legend>

        <p>
          <input type="radio" id="reply-email" name="reply-method" value="email">
          <label for="reply-email">By email</label>
        </p>

        <p>
          <input type="radio" id="reply-none" name="reply-method" value="none">
          <label for="reply-none">No reply needed</label>
        </p>
      </fieldset>

      <p>
        <input type="checkbox" id="updates" name="updates" value="yes">
        <label for="updates">I would like occasional updates</label>
      </p>

      <p>
        <label for="message">Your message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </p>

      <p>
        <button type="submit">Send message</button>
      </p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Kudakwashe SIBANDA</p>
  </footer>
</body>
</html>
